name: txt2epub Android build

# 이 저장소 환경에는 안드로이드 SDK를 받을 수 없어(dl.google.com 차단)
# 컴파일과 APK 빌드는 여기(GitHub 러너)에서 한다.
#
# 쓰는 법: Actions 탭 > "txt2epub Android build" > Run workflow
# 끝나면 실행 결과 페이지 아래 Artifacts에서 app-debug.apk 를 받아 설치하면 된다.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'txt2epub-android/**'
      - '.github/workflows/txt2epub-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: txt2epub-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint (오류만 본다)
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: txt2epub-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: txt2epub-android/app/build/reports/tests/
          if-no-files-found: ignore
